<!DOCTYPE html>

<!-- OBS bounding box: -->
<!-- 1920x1080 -> l:0,r:1725,t:0,b: 950-->
<!--  800x 600 -> l:0,r: 545,t:0,b: 480-->



<style>
    .timer_controls > button {
        position: relative;
        top:200px;
        font-size: 50px;
    }
     #timer{
        font-family: Impact, Haettenschweiler, 'Arial Bold', monospace;
        font-size: 100px;
        width: 255px;
        height: 120px;
        position: relative;
        -webkit-text-stroke-width: 2px;
        -webkit-text-stroke-color: black;
        color: rgb(255, 255, 255);
    }
    #timer > #colon{ 
        position: absolute;
        width: 20px;
        left: 115px;
        text-align: center;
    }

   
    #timer > #min10{
        position: absolute;
        left: 0px;
        width: 55px;
        text-align: center;
    }
    #timer > #min1{
        position: absolute;
        left: 55px;
        width: 55px;
        text-align: center;
    }
  
    #timer > #sec10{
        position: absolute;
        left: 140px;
        width: 55px;
        text-align: center;
    }

    #timer > #sec1{
        position: absolute;
        left: 195px;
        width: 55px;
        text-align: center;
    }
   

    body{
        margin-top: 0;
        margin-bottom: 0;
        margin-left: 0;
        margin-right: 0;
    }
</style>

<html>
    <body>
    <div class="Timer" id="timer">
        <span id="min10">0</span><span id="min1">0</span><span id="colon">:</span><span id="sec10">0</span><span id="sec1">0</span>
    </div>
    <div class="timer_controls"> 
        <button onclick="TimerStart()">Start</button>
        <button onclick="TimerPause()">Pause</button>
        <button onclick="TimerEnd1stHalf()">End 1st half</button>
        <button onclick="TimerPrep2ndHalf()">Prep 2nd half</button>

        <button onclick="TimerReset()">Reset</button>
        <button onclick="TimerRestore()">Restore Timer</button>
    </div>
    </body>
    



<script>
    var TimerElementSec10 = document.getElementById("sec10");
    var TimerElementSec1 = document.getElementById("sec1");
    var TimerElementMin10 = document.getElementById("min10");
    var TimerElementMin1 = document.getElementById("min1");
    
    var IsRunning = false;
    var PreviousTimeStamp = 0;

    var TotalTime = 0;
    var IsSecondHalf = 0;


    var BackupTotalTime = 0;
    var BackUpIsSecondHalf = 0;

    function TimerStart() {
        IsRunning = true;
        PreviousTimeStamp = undefined;
    }
    function TimerPause() {
        IsRunning = false;
    }
    function TimerPrep2ndHalf(){
        if(!IsRunning){
            BackupTotalTime = TotalTime;
            BackUpIsSecondHalf = IsSecondHalf;

            TotalTime = 45 * 60 * 1000;
            IsSecondHalf = 1;
            DisplayTime(TotalTime);
        }
    }


    function TimerEnd1stHalf(){
        if(TotalTime > 45 * 60 * 1000 && !IsSecondHalf){
            BackupTotalTime = TotalTime;
            BackUpIsSecondHalf = IsSecondHalf;
            
            IsRunning = false;
            TotalTime = 45 * 60 * 1000;
            IsSecondHalf = 1;
            DisplayTime(TotalTime);
        }
    }


    function TimerReset(){
        if(!IsRunning){
            BackupTotalTime = TotalTime;
            BackUpIsSecondHalf = IsSecondHalf;

            TotalTime = 0;
            IsSecondHalf = 0;
            DisplayTime(TotalTime);
        }
    }
    function TimerRestore(){
        if(!IsRunning){
            if(BackupTotalTime > 0){
                var tmp = TotalTime;
                TotalTime = BackupTotalTime;
                BackupTotalTime = tmp;
            }
            DisplayTime(TotalTime)
        }
    }

    
    function DisplayTime(TimeMilSec){
         var TimeSeconds = Math.floor(TimeMilSec/1000);
        var DisplayTimeSeconds = TimeSeconds % 60;
        var DisplayTimeMinutes = Math.floor(TimeSeconds / 60);

        TimerElementMin1.innerHTML = DisplayTimeMinutes % 10;
        TimerElementMin10.innerHTML = Math.floor(DisplayTimeMinutes / 10);

        TimerElementSec1.innerHTML = DisplayTimeSeconds % 10;
        TimerElementSec10.innerHTML = Math.floor(DisplayTimeSeconds / 10);
    }

     


    
    function Update(timestamp) {
        if(PreviousTimeStamp === undefined){
            PreviousTimeStamp = timestamp;
        }
        if (IsRunning) {
            Elapsed = timestamp - PreviousTimeStamp;
            TotalTime = TotalTime + Elapsed;
            DisplayTime(TotalTime)
            PreviousTimeStamp = timestamp;
        }
        window.requestAnimationFrame(Update);
    }

    window.requestAnimationFrame(Update);
    


</script>

</html>
