<!DOCTYPE html>

<!-- OBS bounding box: -->
<!-- 1920x1080 -> l:0,r:1725,t:0,b: 950-->
<!--  800x 600 -> l:0,r: 545,t:0,b: 480-->



<style>
    .timer_controls > button {
        position: relative;
        top:200px;
        font-size: 50px;
    }
     #timer{
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', monospace;
        font-size: 100px;
        width: 255px;
        height: 120px;
        position: relative;
        color: rgb(189, 189, 189);
    }
    #timer > #colon{
        position: absolute;
        width: 20px;
        left: 115px;
        text-align: center;
    }

   
    #timer > #min10{
        position: absolute;
        left: 0px;
        width: 55px;
        text-align: center;
    }
    #timer > #min1{
        position: absolute;
        left: 55px;
        width: 55px;
        text-align: center;
    }
  
    #timer > #sec10{
        position: absolute;
        left: 140px;
        width: 55px;
        text-align: center;
    }

    #timer > #sec1{
        position: absolute;
        left: 195px;
        width: 55px;
        text-align: center;
    }
   

    body{
        margin-top: 0;
        margin-bottom: 0;
        margin-left: 0;
        margin-right: 0;
    }
</style>

<html>
    <body>
    <div class="Timer" id="timer">
        <span id="min10">0</span><span id="min1">0</span><span id="colon">:</span><span id="sec10">0</span><span id="sec1">0</span>
    </div>
    <div class="timer_controls"> 
        <button onclick="TimerStart()">Start</button>
        <button onclick="TimerPause()">Pause</button>
        <button onclick="TimerEnd1stHalf()">End 1st half</button>
        <button onclick="TimerPrep2ndHalf()">Prep 2nd half</button>

        <button onclick="TimerReset()">Reset</button>
        <button onclick="TimerRestore()">Restore Timer</button>
    </div>
    </body>
    



<script>
    var TimerElementSec10 = document.getElementById("sec10");
    var TimerElementSec1 = document.getElementById("sec1");
    var TimerElementMin10 = document.getElementById("min10");
    var TimerElementMin1 = document.getElementById("min1");

    var PreviousTimeStamp = 0;
    var IsRunning = false;
    var CurrentTimeSeconds = -1;
    var DisplayTimeMinutes = 0;
    var NewTimeStamp = 0;
    var Elapsed = 0;
    var IsSecondHalf = 0;
    var PreviousTime = 0;

    function TimerStart() {
        IsRunning = true;
        Update();
    }
    function TimerPause() {
        IsRunning = false;
        Update();
    }
    function TimerPrep2ndHalf(){
        if(!IsRunning){
            CurrentTimeSeconds = 45 * 60;
            IsSecondHalf = 1;
             DisplayTime(45,0);
        }
    }


    function TimerEnd1stHalf(){
        if(CurrentTimeSeconds > 45 * 60 && !IsSecondHalf){
            IsRunning = false;
            CurrentTimeSeconds = 45 * 60;
            DisplayTime(45,0);
        }
        
        Update();
    }


    function TimerReset(){
        if(!IsRunning){
            PreviousTime = CurrentTimeSeconds;
            CurrentTimeSeconds = -1;
            IsSecondHalf = 0;
           DisplayTime(0,0);
        }

       
        Update();
    }
    function TimerRestore(){
        if(!IsRunning){
            var tmp = CurrentTimeSeconds;
            CurrentTimeSeconds = PreviousTime;
            PreviousTime = tmp;
            var DisplayTimeSeconds = CurrentTimeSeconds % 60;
            var DisplayTimeMinutes = Math.floor(CurrentTimeSeconds / 60);
            DisplayTime(DisplayTimeMinutes,DisplayTimeSeconds)
        }
        Update();
    }

    function FirstFrame(timestamp){
        PreviousTimeStamp = timestamp;
        Update(timestamp);
    }
    
    function DisplayTime(TimeMin, TimeSec){
        TimerElementMin1.innerHTML = TimeMin % 10;
        TimerElementMin10.innerHTML = Math.floor(TimeMin / 10);

        TimerElementSec1.innerHTML = TimeSec % 10;
        TimerElementSec10.innerHTML = Math.floor(TimeSec / 10);
    }

     



    function Update(timestamp) {
        if (IsRunning) {
            Elapsed = timestamp - PreviousTimeStamp;
            if(Elapsed >= 1000){
                PreviousTimeStamp = timestamp;
                CurrentTimeSeconds = CurrentTimeSeconds + 1;
                var DisplayTimeSeconds = CurrentTimeSeconds % 60;
                var DisplayTimeMinutes = Math.floor(CurrentTimeSeconds / 60);
                DisplayTime(DisplayTimeMinutes,DisplayTimeSeconds)
            }
        }
        window.requestAnimationFrame(Update);
    }

    window.requestAnimationFrame(FirstFrame);


</script>

</html>
